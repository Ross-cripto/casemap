[package]
name = "casemap"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
description = "The living map of your app's use cases: check, render and diff Mermaid flows"
license = "MIT"
repository = "https://github.com/Ross-cripto/casemap"
homepage = "https://github.com/Ross-cripto/casemap"
readme = "README.md"
keywords = ["mermaid", "flowchart", "documentation", "cli", "tui"]
categories = ["command-line-utilities", "development-tools", "visualization"]
exclude = [".claude/", ".codex/", ".agents/", ".github/", "docs/media/", "CLAUDE.md", "dist-workspace.toml", "release-plz.toml"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
base64 = { version = "0.22.1", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
clap_complete = { version = "4.6.11", optional = true }
crossterm = { version = "0.29", default-features = false, features = ["windows"], optional = true }
icy_sixel = { version = "=0.2.0", optional = true }
notify = { version = "8.2.1", optional = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
resvg = { version = "0.48.1", default-features = false, features = ["system-fonts", "text"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
skrifa = { version = "0.44", default-features = false }
tempfile = { version = "3", optional = true }
thiserror = "2.0.21"
toml = { version = "0.8.23", optional = true }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[profile.release]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
insta = "1.49.0"
predicates = "3.1.4"
serde_json = "1.0.154"

[features]
default = ["cli", "tui"]
cli = ["dep:anyhow", "dep:base64", "dep:clap", "dep:clap_complete", "dep:crossterm", "dep:icy_sixel", "dep:libc", "dep:notify", "dep:serde", "dep:serde_json", "dep:tempfile", "dep:toml"]
tui = ["cli", "dep:ratatui"]

[[test]]
name = "snapshots"
path = "tests/snapshots.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[[bin]]
name = "casemap"
path = "src/main.rs"
required-features = ["cli"]
