[package]
name = "casemap"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "The living map of your app's use cases: check, render and diff Mermaid flows"
license = "MIT"
repository = "https://github.com/Ross-cripto/casemap"
homepage = "https://github.com/Ross-cripto/casemap"
readme = "README.md"
keywords = ["mermaid", "flowchart", "documentation", "cli", "tui"]
categories = ["command-line-utilities", "development-tools", "visualization"]
exclude = [".claude/", ".agents/", ".github/", "CLAUDE.md", "dist-workspace.toml", "release-plz.toml"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
clap_complete = { version = "4.6.11", optional = true }
notify = { version = "8.2.1", optional = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
serde_json = { version = "1.0.154", optional = true }
thiserror = "2.0.21"
unicode-width = "0.2"

[profile.release]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
insta = "1.49.0"
predicates = "3.1.4"
serde_json = "1.0.154"

[features]
default = ["cli", "tui"]
cli = ["dep:clap", "dep:clap_complete", "dep:anyhow", "dep:notify", "dep:serde_json"]
tui = ["cli", "dep:ratatui"]

[[test]]
name = "snapshots"
path = "tests/snapshots.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[[bin]]
name = "casemap"
path = "src/main.rs"
required-features = ["cli"]
